services:
  relationship-journal:
    build: .
    container_name: relationship-journal
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /home/jzb/docker/relationshi/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://llm-api.xiaolicloud.cn:18443/v1}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gemini-3.1-pro-high}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-45}
      - OPENAI_JSON_MODE=${OPENAI_JSON_MODE:-0}
